spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/study_tracker}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:study}
spring.datasource.password=${DB_PASSWORD:study}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.cache-names=todoStats
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.redis.enabled=true

jwt.secret=${JWT_SECRET:study-tracker-jwt-secret-key-for-local-development}
jwt.access-token-expiration-millis=${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
