spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.data.redis.url=${REDIS_URL:redis://red-d8jtli6q1p3s73a4ol5g:6379}
spring.cache.type=redis
spring.cache.cache-names=todoStats
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.redis.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-millis=${JWT_ACCESS_TOKEN_EXPIRATION_MILLIS:3600000}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
