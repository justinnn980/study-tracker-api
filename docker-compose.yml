name: study-tracker-api

services:
  postgres:
    image: postgres:18
    container_name: study-tracker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: study_tracker
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
