name: study-tracker-api

services:
  postgres:
    image: postgres:18
    container_name: study-tracker-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: study_tracker
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: study-tracker-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
